name: ci

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy -p imaginarium-core -p imaginarium-cli -p imaginarium-mcp -p imaginarium-server -- -D warnings
      - name: test
        run: cargo test -p imaginarium-core -p imaginarium-cli -p imaginarium-mcp -p imaginarium-server
      - name: build
        run: cargo build -p imaginarium-cli
