[package]
name = "imaginarium-slint"
version.workspace = true
edition = "2021"
license = "GPL-3.0-only"
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Native Slint UI for Imaginarium-RS — winit desktop (linuxkms later)"
publish = false

[[bin]]
name = "imaginarium-app"
path = "src/main.rs"

[features]
default = ["winit"]
winit = []
# Optional Pi path — enable when linking kms backends:
# linuxkms = []

[dependencies]
slint = { version = "1", default-features = true, features = ["backend-winit"] }
tokio = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
directories = { workspace = true }

[build-dependencies]
slint-build = "1"
