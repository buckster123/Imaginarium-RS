openapi: 3.1.0
info:
  title: Imaginarium-RS Local API
  version: 0.1.0
  description: |
    LAN-facing gateway for the xAI Imagine image/video API.

    **Auth.** Every `/v1/*` route requires a token; `/health` is public. A token may
    be presented three ways (any one):
      - `Authorization: Bearer <token>`
      - `X-Imaginarium-Token: <token>`
      - `?token=<token>` query parameter (for browsers / `<img>`/`<video>` sources)
    Token scopes: `read` (GET + job wait + estimate), `write` (create jobs, import, craft),
    `admin` (token management + everything). The env/config node token is admin.
    The upstream xAI key stays on the node and is never returned by the API.

    **Shipped vs planned.** Every path below is implemented. Routes that appear in
    `docs/ARCHITECTURE.md` but are NOT yet implemented — SSE job events
    (`GET /v1/jobs/{id}/events`), library listing/get/delete/upload
    (`GET/DELETE /v1/library`, `GET /v1/library/{id}`, `POST /v1/library/upload`),
    and a standalone video poll route (`GET /v1/videos/{id}`) — are intentionally
    omitted here. Do not build against them yet. Optional spend caps and the
    per-token paid-request bucket live in config (`[limits] max_usd_per_*`,
    `paid_rpm` / `paid_burst`), not as extra routes. Paid generate/edit/extend
    may return **429** + `Retry-After` (`error_type=rate_limit`).
servers:
  - url: http://127.0.0.1:8791
    description: Default loopback bind. LAN use requires an explicit non-loopback bind and a token.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "Authorization: Bearer <token>"
    tokenHeader:
      type: apiKey
      in: header
      name: X-Imaginarium-Token
    tokenQuery:
      type: apiKey
      in: query
      name: token
  schemas:
    Asset:
      type: object
      properties:
        id: { type: string }
        kind: { type: string, enum: [image, video, audio], description: audio = imported tracks (music beds) — never produced upstream }
        local_path: { type: string, nullable: true, description: Node-local path (omitted for remote clients) }
        content_url: { type: string, nullable: true, description: "Set only when the node stored the file. Node-relative path, e.g. /v1/library/{id}/content[?i=N]. Null on auto_download miss." }
        upstream_url: { type: string, nullable: true, description: Ephemeral xAI URL (may expire) }
        file_id: { type: string, nullable: true }
        public_url: { type: string, nullable: true }
        mime_type: { type: string, nullable: true }
    JobResult:
      type: object
      description: Stable agent-facing envelope returned by generate/edit/extend/wait/get.
      properties:
        ok: { type: boolean }
        job_id: { type: string, description: Local ULID (primary id) }
        upstream_request_id: { type: string, nullable: true }
        status: { type: string, enum: [pending, running, done, failed, expired, cancelled] }
        mode: { type: string, enum: [image_generate, image_edit, video_generate, video_edit, video_extend, craft_export] }
        model: { type: string }
        assets: { type: array, items: { $ref: '#/components/schemas/Asset' } }
        usage:
          type: object
          nullable: true
          properties:
            estimated_usd: { type: number, nullable: true }
            upstream_ticks: { type: integer, nullable: true }
        error: { type: string, nullable: true }
        error_type: { type: string, nullable: true, description: "upstream | parse | timeout | download | spend_limit | rate_limit | invalid_mode" }
        created_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time, nullable: true }
        prompt: { type: string, nullable: true }
    TextOverlay:
      type: object
      required: [text]
      properties:
        text: { type: string }
        start_s: { type: number, default: 0 }
        end_s: { type: number, default: 3 }
        x: { type: integer, default: 40 }
        y: { type: integer, default: 40 }
        fontsize: { type: integer, default: 0, description: 0 = inherit style caption_fontsize, then 28 }
        color: { type: string, default: "", description: Named color or '#RRGGBB'; empty = inherit style caption_color, then white }
    TimelineClip:
      type: object
      description: One timeline segment. kind=clip needs job_id (+optional in_s/out_s/speed/gain_db); kind=still needs job_id (an image) + dur_s (+optional zoom_from/zoom_to for Ken Burns); kind=card needs dur_s (+optional card_color, captions carry the text).
      properties:
        kind: { type: string, enum: [clip, still, card], default: clip }
        job_id: { type: string, description: Library job id — a video for clip, an image for still; forbidden on card }
        in_s: { type: number, default: 0 }
        out_s: { type: number, default: 0, description: 0 = full remaining duration (ffprobe-measured) }
        gain_db: { type: number, default: 0, description: Gain for this clip's own audio in the master mix }
        speed: { type: number, default: 1.0, description: Clip playback speed 0.5-2.0; audio follows via atempo }
        dur_s: { type: number, default: 0, description: Segment duration — required for still/card }
        zoom_from: { type: number, default: 1.0, description: Ken-Burns start zoom (still), 1.0-3.0 }
        zoom_to: { type: number, default: 1.0, description: Ken-Burns end zoom (still), 1.0-3.0 }
        card_color: { type: string, default: "", description: Card background; empty = style card_bg, then black }
        captions:
          type: array
          description: Segment-owned captions; times are SEGMENT-LOCAL seconds (max 32 per segment incl. mapped overlays)
          items: { $ref: '#/components/schemas/TextOverlay' }
    CraftStyle:
      type: object
      description: Global styling — config-not-code aesthetics.
      properties:
        caption_fontsize: { type: integer, default: 0, description: Default for captions that set none (0 = 28) }
        caption_color: { type: string, default: "", description: Default caption color (empty = white) }
        card_bg: { type: string, default: "", description: Default card background (empty = black) }
        letterbox_frac: { type: number, default: 0, description: Cinematic bars — EACH bar's height as a fraction of canvas height, 0-0.45 }
        letterbox_reveal_s: { type: number, default: 0, description: Bars open from fully closed over this many seconds at the start (master clock) }
        loudnorm: { type: boolean, default: false, description: Two-pass EBU R128 loudness normalization on the final mix }
    AudioTrack:
      type: object
      required: [job_id]
      properties:
        job_id: { type: string, description: Library job holding audio (an imported track, or any video whose audio to borrow) }
        in_s: { type: number, default: 0, description: Seconds into the source track }
        start_s: { type: number, default: 0, description: Placement on the master clock }
        gain_db: { type: number, default: 0 }
        fade_in_s: { type: number, default: 0 }
        fade_out_s: { type: number, default: 0, description: Anchored to bed end (track end or video end, whichever first) }
    VideoTimeline:
      type: object
      required: [clips]
      properties:
        version: { type: integer, default: 0, description: Contract version — 0/absent = legacy, 1 = the full grammar (kinds/style/speed); newer than the engine → 400 }
        clips:
          type: array
          items: { $ref: '#/components/schemas/TimelineClip' }
        audio_fade_in_s: { type: number, default: 0, description: Fade on the final master mix }
        audio_fade_out_s: { type: number, default: 0 }
        video_fade_in_s: { type: number, default: 0 }
        video_fade_out_s: { type: number, default: 0 }
        overlays:
          type: array
          description: MASTER-CLOCK overlays (absolute seconds); render on every segment they intersect
          items: { $ref: '#/components/schemas/TextOverlay' }
        music: { $ref: '#/components/schemas/AudioTrack' }
        style: { $ref: '#/components/schemas/CraftStyle' }
        width: { type: integer, default: 0, description: Canvas width; 0 = first clip's (even-floored) }
        height: { type: integer, default: 0, description: Canvas height; 0 = first clip's (even-floored) }
        fps: { type: integer, default: 0, description: Canvas fps; 0 = first clip's (rounded, fallback 24) }
        note: { type: string, nullable: true }
    Error:
      type: object
      properties:
        ok: { type: boolean, example: false }
        error: { type: string }

security:
  - bearerAuth: []
  - tokenHeader: []
  - tokenQuery: []

paths:
  /health:
    get:
      summary: Liveness (public — no auth)
      security: []
      responses:
        "200": { description: "{ ok, product, version }" }

  /v1/models:
    get:
      summary: Model catalog + capability matrix
      responses:
        "200": { description: Catalog JSON }
        "401": { description: Missing/invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /v1/estimate:
    post:
      summary: Cost estimate for an image or video job (no spend)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kind: { type: string, enum: [image, video] }
                model: { type: string, description: "concrete model, or \"auto\"/omit for the default (video → grok-imagine-video-1.5)" }
                n: { type: integer }
                duration: { type: integer }
                resolution: { type: string, enum: [480p, 720p, 1080p], description: "Video only. Omitted → 720p (studio/config default, not the 480p floor)." }
      responses:
        "200": { description: Estimate JSON }

  /v1/images/generations:
    post:
      summary: Text-to-image
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt]
              properties:
                prompt: { type: string }
                model: { type: string, description: "grok-imagine-image | grok-imagine-image-quality | grok-imagine-image-2.0 | aliases image/quality/2.0 | \"auto\" | omit" }
                n: { type: integer }
                aspect_ratio: { type: string, description: "1:1, 16:9, 9:16, 4:3, 3:4, 3:2, 2:3, 2:1, 1:2, 19.5:9, 9:19.5, 20:9, 9:20, auto. Unknown values 400." }
                resolution: { type: string, enum: ["1k", "2k"], description: "Unknown values 400. All current image models allow 2k." }
                quality: { type: string, enum: [low, medium], description: "Image 2.0 only. Omitted → upstream default medium. Rejected on other image models." }
      responses:
        "200": { description: JobResult, content: { application/json: { schema: { $ref: '#/components/schemas/JobResult' } } } }
        "400": { description: Invalid model/params (a bare local file path in a media field is rejected here) or spend cap ([limits]) }
        "429": { description: Paid-request rate limit ([limits] paid_rpm). Retry-After header set. }
        "502": { description: Upstream xAI error }

  /v1/images/edits:
    post:
      summary: Image edit (1-3 source images)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt, images]
              properties:
                prompt: { type: string }
                images:
                  type: array
                  maxItems: 3
                  items: { type: string, description: "library:{job_id} (node-library chain ref — preferred; #n suffix addresses batch asset n), data: URL, http(s) URL, or xAI file_… id. Bare local filesystem paths are rejected from the network surface." }
                model: { type: string }
                n: { type: integer }
                aspect_ratio: { type: string }
                resolution: { type: string }
                quality: { type: string, enum: [low, medium], description: "Image 2.0 only. Omitted → upstream default medium." }
      responses:
        "200": { description: JobResult, content: { application/json: { schema: { $ref: '#/components/schemas/JobResult' } } } }
        "400": { description: Bad request (too many/invalid images, bad model) }
        "502": { description: Upstream xAI error }

  /v1/videos/generations:
    post:
      summary: Video generate — T2V / I2V / R2V (mode inferred from fields present)
      description: "Mode inferred from fields: prompt-only (T2V), image (I2V), reference_images and/or reference_audios (R2V). image + reference_* is rejected. Default model is grok-imagine-video-1.5. 1080p is T2V/I2V only; R2V max 720p."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                prompt: { type: string }
                model: { type: string, description: "\"auto\"/omit → grok-imagine-video-1.5 for generate modes" }
                image: { type: string, description: "I2V start frame: library:{job_id}, data:, http(s), or file_…" }
                reference_images: { type: array, items: { type: string, description: "library:{job_id}, data:, http(s), or file_…" } }
                reference_audios: { type: array, maxItems: 3, items: { type: string, description: "Video 1.5 preset voice_id (eve, ara, leo, rex, …). Tag <AUDIO_0>… in the prompt. Audio-only R2V is valid." } }
                duration: { type: integer, description: "1-15s (clamped)" }
                aspect_ratio: { type: string }
                resolution: { type: string, enum: [480p, 720p, 1080p] }
                no_wait: { type: boolean, description: "true = return after submit (poll GET /v1/jobs/{id} or POST /v1/jobs/{id}/wait)" }
      responses:
        "200": { description: "JobResult (status may be pending/running when no_wait or on wait timeout)", content: { application/json: { schema: { $ref: '#/components/schemas/JobResult' } } } }
        "400": { description: Illegal mode/model/resolution combination, or spend cap ([limits]) }
        "429": { description: Paid-request rate limit ([limits] paid_rpm). Retry-After header set. }
        "502": { description: Upstream xAI error }

  /v1/videos/edits:
    post:
      summary: Video edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt, video]
              properties:
                prompt: { type: string }
                video: { type: string, description: "library:{job_id}, data:, http(s), or file_…" }
                model: { type: string }
                no_wait: { type: boolean }
      responses:
        "200": { description: JobResult, content: { application/json: { schema: { $ref: '#/components/schemas/JobResult' } } } }
        "400": { description: Bad request }
        "502": { description: Upstream xAI error }

  /v1/videos/extensions:
    post:
      summary: Video extend (adds a 2-10s segment, default 6; out of range is 400, not clamped)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt, video]
              properties:
                prompt: { type: string }
                video: { type: string }
                duration: { type: integer, minimum: 2, maximum: 10, description: "Extension segment seconds (2–10, default 6). Out of range is 400, not clamped." }
                model: { type: string }
                no_wait: { type: boolean }
      responses:
        "200": { description: JobResult, content: { application/json: { schema: { $ref: '#/components/schemas/JobResult' } } } }
        "400": { description: Bad request (including duration outside 2–10) }
        "502": { description: Upstream xAI error }

  /v1/jobs:
    get:
      summary: List recent jobs (summary rows)
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, default: 20, minimum: 1, maximum: 100 }, description: "Capped at 100. 0 or omit → 20." }
      responses:
        "200": { description: "Array of job summary rows: job_id, status, mode, model, created_at, error, prompt, assets (media count — address each via /content?i=N)" }

  /v1/jobs/{job_id}:
    get:
      summary: Get a job by local ULID
      description: "Returns the stored row. For a non-terminal video job with an upstream_request_id, this also polls xAI once (video_status_once) so no_wait generate + GET completes over HTTP and the MCP proxy. Craft/image jobs and terminal rows are returned as-is. A poll error returns the last known row rather than 502."
      parameters:
        - { name: job_id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: JobResult, content: { application/json: { schema: { $ref: '#/components/schemas/JobResult' } } } }
        "404": { description: Unknown job_id }

  /v1/jobs/{job_id}/wait:
    post:
      summary: Block until a video job resolves (read scope)
      description: "An already-terminal job (incl. synchronous image jobs) returns immediately; an unknown id returns 404; a non-terminal video job is polled to completion or timeout."
      parameters:
        - { name: job_id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: JobResult, content: { application/json: { schema: { $ref: '#/components/schemas/JobResult' } } } }
        "404": { description: Unknown job_id }
        "502": { description: Upstream xAI error }

  /v1/library/{job_id}/content:
    get:
      summary: Stream a media file for a job (bytes)
      description: "job_id is validated as a safe id (no path traversal). ?i=N addresses the N-th asset of a batch (default 0 — the historic first file). Content-Type is inferred from the file."
      parameters:
        - { name: job_id, in: path, required: true, schema: { type: string } }
        - { name: i, in: query, required: false, schema: { type: integer, default: 0 }, description: Asset index within the job }
      responses:
        "200": { description: Raw image/video bytes }
        "400": { description: Invalid asset id }
        "404": { description: Asset not found }

  /v1/library/{job_id}/thumb:
    get:
      summary: 480px JPEG poster for a job's first asset (thumb.jpg)
      description: "Generated eagerly on import/completion and rebuilt lazily on demand (covers pre-thumb library content). Videos take their poster ~1s in; images are downscales. Audio-only jobs 404. The thumb.jpg sidecar is never addressable as a media asset."
      parameters:
        - { name: job_id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: JPEG bytes }
        "400": { description: Invalid asset id }
        "404": { description: Asset not found / no thumbnail (audio) }

  /v1/library/import:
    post:
      summary: Import bytes (data URL or base64) as a completed library job
      description: "Request body limit is 64 MB; decoded import payload is capped at 40 MB. Accepts images, video, and audio (mp3/wav/flac/ogg/m4a/opus — e.g. a Sonus track destined for a craft music bed)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data: { type: string, description: "data: URL or raw base64" }
                filename: { type: string }
                note: { type: string }
                source_job_id: { type: string }
      responses:
        "200": { description: JobResult, content: { application/json: { schema: { $ref: '#/components/schemas/JobResult' } } } }
        "400": { description: Malformed data }
        "413": { description: Decoded payload over 40 MB }

  /v1/craft/video/render:
    post:
      summary: Render a local craft timeline via ffmpeg into a library job
      description: >
        Every segment is normalized onto one canvas (aspect-fit + pad, unified
        fps, yuv420p) before a stream-copy concat, so mixed-resolution/fps
        sources cut cleanly. Segment kinds: clip (trim + speed), still (image +
        Ken-Burns zoom), card (solid color + captions). Audio is mixed in a
        single master-clock pass (clip audio at its timeline offset, speed-
        matched, + the optional music bed, amix normalize=0), with an optional
        two-pass loudnorm ship pass (style.loudnorm). Timeline `overlays` use
        absolute master-clock seconds and render on every segment they
        intersect; segment `captions` use segment-local seconds. Durations are
        ffprobe-measured. Segments are content-hash cached — unchanged segments
        are never re-encoded on a re-render. The craft job's meta.json carries
        full provenance (contract version, engine, ffmpeg version, timeline).
      parameters:
        - { name: no_wait, in: query, required: false, schema: { type: boolean, default: false }, description: "true = return a pending craft job immediately and render in the background; poll GET /v1/jobs/{id} (or POST /wait — for craft jobs it returns the current row without touching upstream). Default blocks until the render lands." }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VideoTimeline'
      responses:
        "200": { description: "JobResult — done with assets (sync), or pending (no_wait; a failed render flips the job to failed with the error)", content: { application/json: { schema: { $ref: '#/components/schemas/JobResult' } } } }
        "400": { description: Empty timeline / ffmpeg missing / invalid job_id / bad clip window (sync path) }

  /v1/tokens:
    get:
      summary: List tokens (admin) — hashes never returned
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: "{ tokens: [...] }" }
        "403": { description: Requires admin scope }
    post:
      summary: Mint a token (admin) — plaintext shown once
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label: { type: string }
                scope: { type: string, enum: [read, write, admin], default: write }
      responses:
        "200": { description: "{ id, label, scope, token, created_at }" }

  /v1/tokens/{id}:
    delete:
      summary: Revoke a token (admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "{ ok, revoked }" }
        "404": { description: Unknown token id }
