openapi: 3.1.0
info:
  title: Imaginarium-RS Local API
  version: 0.1.0
  description: |
    LAN-facing gateway for the xAI Imagine image/video API.

    **Auth.** Every `/v1/*` route requires a token; `/health` is public. A token may
    be presented three ways (any one):
      - `Authorization: Bearer <token>`
      - `X-Imaginarium-Token: <token>`
      - `?token=<token>` query parameter (for browsers / `<img>`/`<video>` sources)
    Token scopes: `read` (GET + job wait), `write` (create jobs, import, craft),
    `admin` (token management + everything). The env/config node token is admin.
    The upstream xAI key stays on the node and is never returned by the API.

    **Shipped vs planned.** Every path below is implemented. Routes that appear in
    `docs/ARCHITECTURE.md` but are NOT yet implemented — SSE job events
    (`GET /v1/jobs/{id}/events`), library listing/get/delete/upload
    (`GET/DELETE /v1/library`, `GET /v1/library/{id}`, `POST /v1/library/upload`),
    a standalone video poll route (`GET /v1/videos/{id}`), and per-token rate limits
    / spend caps — are intentionally omitted here. Do not build against them yet.
servers:
  - url: http://127.0.0.1:8791
    description: Default loopback bind. LAN use requires an explicit non-loopback bind and a token.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "Authorization: Bearer <token>"
    tokenHeader:
      type: apiKey
      in: header
      name: X-Imaginarium-Token
    tokenQuery:
      type: apiKey
      in: query
      name: token
  schemas:
    Asset:
      type: object
      properties:
        id: { type: string }
        kind: { type: string, enum: [image, video] }
        local_path: { type: string, nullable: true, description: Node-local path (omitted for remote clients) }
        content_url: { type: string, nullable: true, description: Node-relative bytes path, e.g. /v1/library/{id}/content }
        upstream_url: { type: string, nullable: true, description: Ephemeral xAI URL (may expire) }
        file_id: { type: string, nullable: true }
        public_url: { type: string, nullable: true }
        mime_type: { type: string, nullable: true }
    JobResult:
      type: object
      description: Stable agent-facing envelope returned by generate/edit/extend/wait/get.
      properties:
        ok: { type: boolean }
        job_id: { type: string, description: Local ULID (primary id) }
        upstream_request_id: { type: string, nullable: true }
        status: { type: string, enum: [pending, running, done, failed, expired, cancelled] }
        mode: { type: string, enum: [image_generate, image_edit, video_generate, video_edit, video_extend, craft_export] }
        model: { type: string }
        assets: { type: array, items: { $ref: '#/components/schemas/Asset' } }
        usage:
          type: object
          nullable: true
          properties:
            estimated_usd: { type: number, nullable: true }
            upstream_ticks: { type: integer, nullable: true }
        error: { type: string, nullable: true }
        error_type: { type: string, nullable: true, description: e.g. upstream, parse, timeout }
        created_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time, nullable: true }
        prompt: { type: string, nullable: true }
    Error:
      type: object
      properties:
        ok: { type: boolean, example: false }
        error: { type: string }

security:
  - bearerAuth: []
  - tokenHeader: []
  - tokenQuery: []

paths:
  /health:
    get:
      summary: Liveness (public — no auth)
      security: []
      responses:
        "200": { description: "{ ok, product, version }" }

  /v1/models:
    get:
      summary: Model catalog + capability matrix
      responses:
        "200": { description: Catalog JSON }
        "401": { description: Missing/invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /v1/estimate:
    post:
      summary: Cost estimate for an image or video job (no spend)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kind: { type: string, enum: [image, video] }
                model: { type: string, description: "concrete model, or \"auto\"/omit for the default" }
                n: { type: integer }
                duration: { type: integer }
      responses:
        "200": { description: Estimate JSON }

  /v1/images/generations:
    post:
      summary: Text-to-image
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt]
              properties:
                prompt: { type: string }
                model: { type: string, description: "grok-imagine-image | grok-imagine-image-quality | \"auto\" | omit" }
                n: { type: integer }
                aspect_ratio: { type: string }
                resolution: { type: string, enum: ["1k", "2k"] }
      responses:
        "200": { description: JobResult, content: { application/json: { schema: { $ref: '#/components/schemas/JobResult' } } } }
        "400": { description: Invalid model/params (a bare local file path in a media field is rejected here) }
        "502": { description: Upstream xAI error }

  /v1/images/edits:
    post:
      summary: Image edit (1-3 source images)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt, images]
              properties:
                prompt: { type: string }
                images:
                  type: array
                  maxItems: 3
                  items: { type: string, description: "data: URL, http(s) URL, or xAI file_… id. Local filesystem paths are rejected from the network surface." }
                model: { type: string }
                n: { type: integer }
                aspect_ratio: { type: string }
                resolution: { type: string }
      responses:
        "200": { description: JobResult, content: { application/json: { schema: { $ref: '#/components/schemas/JobResult' } } } }
        "400": { description: Bad request (too many/invalid images, bad model) }
        "502": { description: Upstream xAI error }

  /v1/videos/generations:
    post:
      summary: Video generate — T2V / I2V / R2V (mode inferred from fields present)
      description: "Exactly one of: prompt-only (T2V), image (I2V), reference_images (R2V). image + reference_images together is rejected."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                prompt: { type: string }
                model: { type: string, description: "\"auto\"/omit auto-selects by modality (I2V→video-1.5, else video)" }
                image: { type: string, description: "data:/http(s)/file_… (I2V)" }
                reference_images: { type: array, items: { type: string } }
                duration: { type: integer, description: "1-15s (clamped)" }
                aspect_ratio: { type: string }
                resolution: { type: string, enum: [480p, 720p, 1080p] }
                no_wait: { type: boolean, description: "true = return after submit (poll with /v1/jobs/{id}/wait)" }
      responses:
        "200": { description: "JobResult (status may be pending/running when no_wait or on wait timeout)", content: { application/json: { schema: { $ref: '#/components/schemas/JobResult' } } } }
        "400": { description: Illegal mode/model/resolution combination }
        "502": { description: Upstream xAI error }

  /v1/videos/edits:
    post:
      summary: Video edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt, video]
              properties:
                prompt: { type: string }
                video: { type: string, description: "data:/http(s)/file_…" }
                model: { type: string }
                no_wait: { type: boolean }
      responses:
        "200": { description: JobResult, content: { application/json: { schema: { $ref: '#/components/schemas/JobResult' } } } }
        "400": { description: Bad request }
        "502": { description: Upstream xAI error }

  /v1/videos/extensions:
    post:
      summary: Video extend (adds a 2-10s segment, default 6)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt, video]
              properties:
                prompt: { type: string }
                video: { type: string }
                duration: { type: integer }
                model: { type: string }
                no_wait: { type: boolean }
      responses:
        "200": { description: JobResult, content: { application/json: { schema: { $ref: '#/components/schemas/JobResult' } } } }
        "400": { description: Bad request }
        "502": { description: Upstream xAI error }

  /v1/jobs:
    get:
      summary: List recent jobs (summary rows)
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, default: 20 } }
      responses:
        "200": { description: Array of job summary rows }

  /v1/jobs/{job_id}:
    get:
      summary: Get a job by local ULID
      parameters:
        - { name: job_id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: JobResult, content: { application/json: { schema: { $ref: '#/components/schemas/JobResult' } } } }
        "404": { description: Unknown job_id }

  /v1/jobs/{job_id}/wait:
    post:
      summary: Block until a video job resolves (read scope)
      description: "An already-terminal job (incl. synchronous image jobs) returns immediately; an unknown id returns 404; a non-terminal video job is polled to completion or timeout."
      parameters:
        - { name: job_id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: JobResult, content: { application/json: { schema: { $ref: '#/components/schemas/JobResult' } } } }
        "404": { description: Unknown job_id }
        "502": { description: Upstream xAI error }

  /v1/library/{job_id}/content:
    get:
      summary: Stream the first media file for a job (bytes)
      description: "job_id is validated as a safe id (no path traversal). Content-Type is inferred from the file."
      parameters:
        - { name: job_id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Raw image/video bytes }
        "400": { description: Invalid asset id }
        "404": { description: Asset not found }

  /v1/library/import:
    post:
      summary: Import bytes (data URL or base64) as a completed library job
      description: "Request body limit is 64 MB; decoded import payload is capped at 40 MB."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data: { type: string, description: "data: URL or raw base64" }
                filename: { type: string }
                note: { type: string }
                source_job_id: { type: string }
      responses:
        "200": { description: JobResult, content: { application/json: { schema: { $ref: '#/components/schemas/JobResult' } } } }
        "400": { description: Malformed data }
        "413": { description: Decoded payload over 40 MB }

  /v1/craft/video/render:
    post:
      summary: Render a local craft timeline via ffmpeg into a library job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: VideoTimeline (clips + fades + overlays); clip job_ids are validated.
      responses:
        "200": { description: JobResult, content: { application/json: { schema: { $ref: '#/components/schemas/JobResult' } } } }
        "400": { description: Empty timeline / ffmpeg missing / invalid job_id }

  /v1/tokens:
    get:
      summary: List tokens (admin) — hashes never returned
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: "{ tokens: [...] }" }
        "403": { description: Requires admin scope }
    post:
      summary: Mint a token (admin) — plaintext shown once
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label: { type: string }
                scope: { type: string, enum: [read, write, admin], default: write }
      responses:
        "200": { description: "{ id, label, scope, token, created_at }" }

  /v1/tokens/{id}:
    delete:
      summary: Revoke a token (admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "{ ok, revoked }" }
        "404": { description: Unknown token id }
